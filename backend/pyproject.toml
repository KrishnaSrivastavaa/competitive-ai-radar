[project]
name = "backend"
version = "0.1.0"
description = "Competitive AI Radar API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "google-genai>=2.19.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
